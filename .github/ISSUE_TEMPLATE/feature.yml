name: Feature
description: A change you want
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      placeholder: Concrete behavior, not a slogan.
    validations:
      required: true
