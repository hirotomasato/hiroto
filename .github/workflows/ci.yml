name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          GOTOOLCHAIN: auto
        run: go build ./...

      - name: Vet
        env:
          GOTOOLCHAIN: auto
        run: go vet ./...

      - name: Test
        env:
          GOTOOLCHAIN: auto
        run: go test ./...
