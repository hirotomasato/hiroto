name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Go version
        run: go version

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: auto
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/hiroto-linux-amd64     ./cmd/hiroto
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/hiroto-linux-arm64     ./cmd/hiroto
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/hiroto-darwin-amd64    ./cmd/hiroto
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/hiroto-darwin-arm64    ./cmd/hiroto
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/hiroto-windows-amd64.exe ./cmd/hiroto
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Hiroto ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
