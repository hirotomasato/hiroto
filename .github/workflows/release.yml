name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: CGO_ENABLED=0 go build -o hiroto-linux-amd64 ./cmd/hiroto

      - name: Create Release
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{
              \"tag_name\": \"${{ github.ref_name }}\",
              \"name\": \"Hiroto ${{ github.ref_name }}\",
              \"generate_release_notes\": true
            }" > release.json
          cat release.json

      - name: Upload Asset
        run: |
          UPLOAD_URL=$(cat release.json | jq -r .upload_url | sed 's/{.*}//')
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "$UPLOAD_URL?name=hiroto-linux-amd64" \
            --data-binary @hiroto-linux-amd64