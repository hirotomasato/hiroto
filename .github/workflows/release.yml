name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: GOTOOLCHAIN=go1.24.0 CGO_ENABLED=0 go build -o hiroto ./cmd/hiroto
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} hiroto -t "Hiroto ${{ github.ref_name }}" --generate-notes