name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o hiroto-linux-amd64 ./cmd/hiroto
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o hiroto-linux-arm64 ./cmd/hiroto
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o hiroto-darwin-amd64 ./cmd/hiroto
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o hiroto-darwin-arm64 ./cmd/hiroto

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hiroto-linux-amd64
            hiroto-linux-arm64
            hiroto-darwin-amd64
            hiroto-darwin-arm64
          generate_release_notes: true