name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build linux amd64
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: auto
        run: |
          set -eux
          go version
          mkdir -p dist
          go build -trimpath -o dist/hiroto-linux-amd64 ./cmd/hiroto
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Hiroto ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/hiroto-linux-amd64
