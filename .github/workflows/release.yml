name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A GitHub Release (not the tag zip) is what /releases/latest and
# `hiroto --update` look at. Source zip/tarball is attached automatically.
# Prebuilt binaries are optional: install.sh uses `go install @latest`.
jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v3
        with:
          name: Hiroto ${{ github.ref_name }}
          generate_release_notes: true
