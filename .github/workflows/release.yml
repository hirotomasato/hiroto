name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: Hiroto ${{ github.ref_name }}
          generate_release_notes: true

  linux-binary:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        env:
          GOTOOLCHAIN: auto
        run: go build -o hiroto-linux-amd64 ./cmd/hiroto
      - uses: softprops/action-gh-release@v2
        with:
          files: hiroto-linux-amd64
