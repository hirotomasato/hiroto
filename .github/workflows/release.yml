name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: |
          CGO_ENABLED=0 go build -o hiroto-linux-amd64 ./cmd/hiroto

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: hiroto-linux-amd64
          generate_release_notes: true