name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        run: |
          curl -sL https://go.dev/dl/go1.24.0.linux-amd64.tar.gz | tar xz -C /usr/local
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Build
        run: CGO_ENABLED=0 go build -o hiroto-linux-amd64 ./cmd/hiroto

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: hiroto-linux-amd64
          generate_release_notes: true